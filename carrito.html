<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passgro | Tu carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/carrito.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="carrito-section">
    <div class="wrap">
      <div class="section-head">
        <span class="tag">Carrito</span>
        <h2>Tu carrito</h2>
      </div>
      <div class="carrito-grid">
        <div class="cart-list" id="cartItems"></div>
        <div class="cart-summary">
          <h3>Resumen</h3>
          <div class="subtotal-row"><span>Subtotal</span><b class="mono" id="cartSubtotal">$0</b></div>
          <button class="btn btn-primary btn-block" id="checkoutBtn">Proceder al pago</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/session.js"></script>
<script src="js/cart-store.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/carrito.js"></script>
</body>
</html>
